# dsh-imgdraw 发布工作流（OIDC Trusted Publishing）
#
# 安全模型（2026-09 单库化：从 monorepo 的 NPM_TOKEN + 人工审批迁移到 OIDC）：
# - 触发 = 本机人工创建的 tag（imgdraw-vX.Y.Z），发布决策永远是人的决定
# - 认证：npm Trusted Publishing（OIDC）——npmjs.com 包设置里配置的 trusted
#   publisher 只接受本仓库 publish.yml 的发布，免长期 token、自动 provenance
#   （来源仓库须 public 才能生成 provenance）
# - 权限最小化：contents: read + id-token: write（OIDC 签发所需）
# - 版本一致性守卫：tag 版本必须与 package.json version 完全一致
#   （打 tag 用显式两步：npm version --no-git-tag-version → 手动 git tag imgdraw-v$V，
#    见 PUBLISHING.md——npm version 默认打 v%s tag，与本触发器不符）
# - actions 按 SHA 固定（防供应链；升级 action 时换 SHA 并注明版本）
name: publish

on:
  push:
    tags:
      - 'imgdraw-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

# 可选人工审批门：GitHub repo Settings → Environments 建 <env 名> 并设
# required reviewers，然后取消下行注释（npm 端 trusted publisher 的
# environment 字段须与这里同名，逐字段一致）。
# environment: npm-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # 注意：不加 registry-url。setup-node 的 registry-url 会写一个带占位
        # _authToken 的 .npmrc（NODE_AUTH_TOKEN=XXXXX…），shadow 掉 OIDC 认证，
        # 使 npm publish 走 token 路径而 E404。trusted publishing 纯靠
        # id-token: write，无需 registry-url / NODE_AUTH_TOKEN。
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 'Guard: tag version matches package.json'
        run: |
          EXPECTED="refs/tags/imgdraw-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$EXPECTED" ]; then
            echo "::error::tag/version mismatch: $GITHUB_REF vs $EXPECTED"
            exit 1
          fi
      - name: Install
        run: npm ci --legacy-peer-deps
        # 有 Playwright 视觉测试的库再加：env: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Verify (build → typecheck → smoke/vitest → mount …)
        # 验证链单源：scripts/verify.mjs——链内增删步骤只改它；此处与 package.json "test" 都只调它。
        # smoke/mount/vitest 为探测式：文件存在才跑，接入即自动进链。
        run: node scripts/verify.mjs
      - name: Publish to npm (OIDC trusted publishing)
        # 升级 npm：trusted publishing 需 npm CLI >= 11.5.1（含 OIDC 登录支持）。
        # OIDC 认证由 id-token: write 提供，无需 NODE_AUTH_TOKEN；provenance
        # 依赖 public 源仓库。
        # prerelease → dist-tag next（忘加 --tag next 是最常见事故：
        # 用户 npm install 会装到 prerelease）；稳定版 → latest。
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "canary prerelease $VERSION → dist-tag next"
            npm publish --access public --tag next --provenance --loglevel verbose
          else
            echo "stable $VERSION → dist-tag latest"
            npm publish --access public --provenance --loglevel verbose
          fi

# dsh-imgdraw CI 工作流（push/PR 验证）
#
# 首推前置：package-lock.json 必须已生成并入库（下方 npm ci 与 setup-node cache 都依赖
# 它——参照实践库踩过的"setup-node cache 找不到 lockfile"坑；首次 commit 前先本地
# npm install --legacy-peer-deps 生成 lockfile，模板 TODO 第 5 步有此指引）。
#
# 与 publish.yml 的分工：
# - 本 workflow：push 到 main / PR 时跑验证链——把坏提交拦在进 main 当下，
#   而不是等打 tag 发布时（publish.yml）才暴露
# - 验证链与发布完全同源：scripts/verify.mjs 单源入口（npm test / publish.yml / 此处三者同调），
#   链内增删步骤只改 verify.mjs
# - 无发布语义：不需要 id-token（那是 OIDC 用的），权限只要 contents: read
# - 新 push 取消同分支旧 run（与 publish.yml 的 cancel-in-progress: false 相反——
#   发布不取消，验证随时可弃）
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # 不加 registry-url：CI 只读验证，不发布（见 publish.yml 内的 OIDC 说明）
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Verify
        run: node scripts/verify.mjs
